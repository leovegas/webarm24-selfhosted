# WebArm24 Self-hosted — production stack.
#
#   app    — the licensed WebArm24 image (FastAPI + Playwright + Python sandbox)
#   db     — PostgreSQL 16 (all app data except stored files)
#   caddy  — HTTPS reverse proxy with automatic Let's Encrypt certificates
#
# Do not edit this file for configuration: everything is in .env (see .env.example and docs/03-configuration.md).
# Operate the stack with ./webarmctl (install, upgrade, backup, restore, doctor …), not raw `docker compose`,
# so backups and drains happen in the right order.

name: webarm

services:
  app:
    image: ${WEBARM_IMAGE:-registry.webarm24.online/webarm/selfhosted}:${WEBARM_TAG:-stable}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Only values derived from other .env entries live here (anything listed here overrides .env).
      PORT: "8000"
      DATABASE_URL: "postgresql://webarm:${POSTGRES_PASSWORD}@db:5432/webarm"
      PUBLIC_BASE_URL: "https://${PUBLIC_HOST}"
      LICENSE_KEY_FILE: "/run/secrets/webarm_license"
      PIPELINE_PYTHON_WORKDIR_ROOT: "/app/backend/data/python_steps"
      PIPELINE_USER_FILES_ROOT: "/app/backend/data/user_files"
      CUSTOM_PAGES_DIR: "/app/custom"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - appdata:/app/backend/data          # stored files, python envs, install state — BACK THIS UP
      - knowledge:/app/backend/knowledge   # per-site crawl cache (safe to lose)
      - videos:/app/backend/videos         # optional session recordings
      - ./license:/run/secrets:ro          # license/webarm_license (written by `webarmctl license set`)
      - ./custom:/app/custom:ro            # optional terms-of-service.html / privacy-policy.html
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    stop_grace_period: 60s
    # Chromium needs a large /dev/shm; init reaps Playwright's child processes.
    shm_size: "1gb"
    init: true
    # bubblewrap (sandbox for pipeline Python steps) needs to create nested namespaces.
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: webarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: webarm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webarm -d webarm"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
      TLS_MODE: ${TLS_MODE:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro   # rendered from Caddyfile.template by webarmctl
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  appdata:
  knowledge:
  videos:
  pgdata:
  caddy_data:
  caddy_config:
